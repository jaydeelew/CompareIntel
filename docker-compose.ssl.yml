# Shared json-file log cap so container logs cannot fill the 19 GB host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    # Cache and rate-limit keys all have TTLs; volatile-lru evicts those first and
    # leaves the tiny no-TTL concurrent counters intact (DECR on a missing key is unsafe).
    # 64mb is well above expected <10 MB usage and leaves RAM for gunicorn on a 2 GB host.
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy volatile-lru
    mem_limit: 96m
    mem_reservation: 32m
    logging: *default-logging
    volumes:
      - redis_data:/data
    networks:
      - compareintel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: compareintel-backend:${IMAGE_TAG:-current}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
        GIT_SHA: ${GIT_SHA:-}
    environment:
      - PYTHONPATH=/app
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    env_file:
      - ./backend/.env
    mem_limit: 768m
    mem_reservation: 384m
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - compareintel-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      additional_contexts:
        core: ./packages/compare-core
      target: build
      args:
        - VITE_API_URL=/api
        - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY:-}
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
        - VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT:-production}
        - VITE_SENTRY_RELEASE=${GIT_SHA:-}
    volumes:
      - ./frontend/dist:/app/dist
    mem_limit: 256m
    mem_reservation: 64m
    logging: *default-logging
    depends_on:
      - backend
    networks:
      - compareintel-network

  nginx:
    image: compareintel-nginx:${IMAGE_TAG:-current}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      additional_contexts:
        core: ./packages/compare-core
      target: prod
      args:
        - VITE_API_URL=/api
        - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY:-}
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
        - VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT:-production}
        - VITE_SENTRY_RELEASE=${GIT_SHA:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.ssl.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/mime.types.custom:/etc/nginx/mime.types.custom:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/lib/letsencrypt:/var/lib/letsencrypt:ro
      - /var/www/certbot:/var/www/certbot:ro
    mem_limit: 96m
    mem_reservation: 32m
    logging: *default-logging
    depends_on:
      - backend
      - frontend
    networks:
      - compareintel-network

networks:
  compareintel-network:
    driver: bridge

volumes:
  redis_data:
