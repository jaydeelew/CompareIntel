# Shared json-file log cap so container logs cannot fill the 19 GB host disk.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    # Cache and rate-limit keys all have TTLs; volatile-lru evicts those first and
    # leaves the tiny no-TTL concurrent counters intact (DECR on a missing key is unsafe).
    # 64mb is well above expected <10 MB usage and leaves RAM for gunicorn on a 2 GB host.
    command: redis-server --appendonly yes --maxmemory 64mb --maxmemory-policy volatile-lru
    mem_limit: 96m
    mem_reservation: 32m
    logging: *default-logging
    volumes:
      - redis_data:/data
    networks:
      - compareintel-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend:
    image: compareintel-backend:${IMAGE_TAG:-current}
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: production
        GIT_SHA: ${GIT_SHA:-}
    environment:
      - PYTHONPATH=/app
      - WEB_CONCURRENCY=${WEB_CONCURRENCY:-2}
    env_file:
      - ./backend/.env
    mem_limit: 768m
    mem_reservation: 384m
    logging: *default-logging
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; r=urllib.request.urlopen('http://localhost:8000/health', timeout=5); exit(0 if b'healthy' in r.read() else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - compareintel-network

  # Frontend is built inside nginx's multi-stage Dockerfile (prod stage copies from build).
  # No separate frontend container needed—nginx builds and serves static files.

  nginx:
    image: compareintel-nginx:${IMAGE_TAG:-current}
    build:
      context: ./frontend
      dockerfile: Dockerfile
      additional_contexts:
        core: ./packages/compare-core
      target: prod
      args:
        - VITE_API_URL=/api
        - VITE_RECAPTCHA_SITE_KEY=${VITE_RECAPTCHA_SITE_KEY:-}
        - VITE_SENTRY_DSN=${VITE_SENTRY_DSN:-}
        - VITE_SENTRY_ENVIRONMENT=${VITE_SENTRY_ENVIRONMENT:-production}
        - VITE_SENTRY_RELEASE=${GIT_SHA:-}
    ports:
      - "8080:8080"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
    mem_limit: 96m
    mem_reservation: 32m
    logging: *default-logging
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - compareintel-network

networks:
  compareintel-network:
    driver: bridge

volumes:
  redis_data:
