name: Production Operations

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Operation to perform'
        required: true
        type: choice
        options:
          - status
          - logs
          - deploy
          - rollback
        default: 'status'

concurrency:
  group: production-ops
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write  # Required for AWS OIDC authentication

jobs:
  ops:
    name: Production ${{ github.event.inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    env:
      HAS_AWS_SG: ${{ secrets.AWS_SG_ID != '' }}
      HAS_AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID != '' }}
      HAS_AWS_ROLE: ${{ secrets.AWS_ROLE_ARN != '' }}
    
    steps:
      - name: Check authorization
        run: |
          if [ "${{ github.actor }}" != "jaydeelew" ]; then
            echo "❌ Unauthorized: Only jaydeelew can run production operations"
            exit 1
          fi
          echo "✅ Authorized user: ${{ github.actor }}"

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          SSH_HOST: ${{ secrets.PROD_HOST }}
          SSH_USER: ${{ secrets.PROD_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "❌ Missing required secrets: PROD_SSH_KEY, PROD_HOST, or PROD_USER"
            echo "See docs/ops/PRODUCTION_OPERATIONS_WORKFLOW.md for setup instructions"
            exit 1
          fi
          
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/prod_key
          chmod 600 ~/.ssh/prod_key
          echo "✅ SSH key configured"

      - name: Configure AWS credentials (IAM user)
        if: env.HAS_AWS_SG == 'true' && env.HAS_AWS_ACCESS_KEY == 'true'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Configure AWS credentials (OIDC)
        if: env.HAS_AWS_SG == 'true' && env.HAS_AWS_ROLE == 'true' && env.HAS_AWS_ACCESS_KEY == 'false'
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Authorize runner IP in security group
        if: env.HAS_AWS_SG == 'true'
        env:
          AWS_SG_ID: ${{ secrets.AWS_SG_ID }}
        run: |
          echo "🔓 Authorizing GitHub Actions runner IP in security group..."
          
          # Get runner's public IP
          RUNNER_IP=$(curl -s https://checkip.amazonaws.com)
          echo "Runner IP: $RUNNER_IP"
          echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
          
          # Add temporary SSH access rule
          aws ec2 authorize-security-group-ingress \
            --group-id "$AWS_SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" \
            --tag-specifications "ResourceType=security-group-rule,Tags=[{Key=Name,Value=github-actions-temp},{Key=ManagedBy,Value=github-actions},{Key=Workflow,Value=${{ github.workflow }}},{Key=RunId,Value=${{ github.run_id }}}]" \
            || {
              echo "⚠️ Note: Rule may already exist (exit code $?). Continuing..."
              echo "RUNNER_IP=$RUNNER_IP" >> $GITHUB_ENV
            }
          
          echo "✅ Security group rule added: ${RUNNER_IP}/32 → port 22"
          
          # Wait a moment for AWS to propagate the rule
          sleep 3

      - name: Run ${{ github.event.inputs.action }}
        env:
          SSH_HOST: ${{ secrets.PROD_HOST }}
          SSH_USER: ${{ secrets.PROD_USER }}
          APP_DIR: ${{ secrets.PROD_APP_DIR }}
        run: |
          # Default to documented production path if PROD_APP_DIR not set
          APP_DIR="${APP_DIR:-/home/ubuntu/CompareIntel}"
          
          echo "📡 Connecting to production server..."
          echo "Host: $SSH_HOST"
          echo "User: $SSH_USER"
          echo "App Directory: $APP_DIR"
          echo ""
          
          # Create output file for job summary
          OUTPUT_FILE=$(mktemp)
          
          # Run the deployment script with the selected action
          ssh -i ~/.ssh/prod_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "$SSH_USER@$SSH_HOST" \
            "cd $APP_DIR && ./deploy-production.sh ${{ github.event.inputs.action }}" \
            2>&1 | tee "$OUTPUT_FILE"
          
          EXIT_CODE=${PIPESTATUS[0]}
          
          # For logs action, also print recent docker logs
          if [ "${{ github.event.inputs.action }}" = "logs" ]; then
            echo ""
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            echo "📋 Recent Docker Compose Logs (last 200 lines):"
            echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
            ssh -i ~/.ssh/prod_key \
              -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=30 \
              "$SSH_USER@$SSH_HOST" \
              "cd $APP_DIR && docker compose -f docker-compose.ssl.yml logs --tail=200" \
              2>&1 | tee -a "$OUTPUT_FILE"
          fi
          
          # Write output to job summary
          echo "## Production Operations: ${{ github.event.inputs.action }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** $SSH_HOST" >> $GITHUB_STEP_SUMMARY
          echo "**Directory:** $APP_DIR" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat "$OUTPUT_FILE" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          rm -f "$OUTPUT_FILE"
          
          if [ $EXIT_CODE -ne 0 ]; then
            echo ""
            echo "❌ Operation failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          
          echo ""
          echo "✅ Operation completed successfully"

      - name: Revoke runner IP from security group
        if: always() && env.HAS_AWS_SG == 'true' && env.RUNNER_IP != ''
        env:
          AWS_SG_ID: ${{ secrets.AWS_SG_ID }}
        run: |
          echo "🔒 Revoking GitHub Actions runner IP from security group..."
          
          aws ec2 revoke-security-group-ingress \
            --group-id "$AWS_SG_ID" \
            --protocol tcp \
            --port 22 \
            --cidr "${RUNNER_IP}/32" \
            || echo "⚠️ Failed to revoke rule (may have been already removed or never added)"
          
          echo "✅ Security group rule revoked: ${RUNNER_IP}/32"

      - name: Cleanup
        if: always()
        run: |
          rm -f ~/.ssh/prod_key
          echo "✅ SSH key cleaned up"
