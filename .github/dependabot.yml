version: 2
updates:
  # Backend Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      # Majors stay ungrouped so they can be reviewed one at a time.
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # Ignore rules apply to grouped version updates. Version ranges
    # also apply to Dependabot security updates (update-types alone do not).
    ignore:
      # bcrypt 5+ breaks passlib 1.7.4 (backend is pinned at bcrypt==4.0.1).
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bcrypt"
        versions: [">=5.0.0"]
      # Also hold 4.1+; 4.0.1 is the last release known-good with passlib 1.7.4.
      - dependency-name: "bcrypt"
        versions: [">=4.1.0"]
      # openai 3+ needs a client migration (backend is on openai 2.x).
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai"
        versions: [">=3.0.0"]
      # Stripe 16+ is a major client rewrite; keep majors ungrouped and ignored.
      - dependency-name: "stripe"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
    # No repo labels exist for Dependabot; [] disables default labels too.
    labels: []
    commit-message:
      prefix: "build(backend)"
      include: "scope"
    reviewers:
      - "jaydeelew"

  # npm workspace (root lockfile). The root package.json declares workspaces
  # covering packages/*, extension, and frontend. All workspace members share
  # the root package-lock.json, so Dependabot must point at "/" to update the
  # lockfile CI actually reads. Extension references @compareintel/core (the
  # workspace package at packages/compare-core) via file:../packages/compare-core,
  # which npm resolves correctly through the workspace configuration.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        exclude-patterns:
          - "vitest"
          - "@vitest/*"
          - "prettier"
          - "@axe-core/*"
        update-types:
          - "minor"
          - "patch"
      vitest:
        applies-to: version-updates
        patterns:
          - "vitest"
          - "@vitest/*"
        update-types:
          - "minor"
          - "patch"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    # Ignore rules apply to grouped version updates. Version ranges
    # also apply to Dependabot security updates (update-types alone do not).
    ignore:
      # Pin Playwright to 1.60.x to match Docker image
      # mcr.microsoft.com/playwright:v1.60.0-noble. 1.64 is a minor bump,
      # so ignore versions rather than semver-major.
      - dependency-name: "@playwright/test"
        versions: [">=1.61.0"]
      - dependency-name: "playwright"
        versions: [">=1.61.0"]
      - dependency-name: "playwright-core"
        versions: [">=1.61.0"]
      # Hold vite 8+ (current range is ^6). Semver-major covers 7+
      # version updates; the version range also covers security updates.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        versions: [">=8.0.0"]
      # frontend is on typescript ~5.3.0; 5.4+ is a separate migration.
      - dependency-name: "typescript"
        versions: [">=5.4.0"]
      # jszip 3.10.2+ is held for the GPL license constraint (stay on 3.10.1).
      - dependency-name: "jszip"
        versions: [">=3.10.2"]
      # eslint 10+ is blocked by plugin incompatibilities (eslint-plugin-import
      # 2.32.0 and eslint-plugin-react-hooks 5.2.0 only support eslint ^9).
      - dependency-name: "eslint"
        versions: [">=10"]
      # React 19 / plugin-react 5 / Vitest 5 / imagetools 10+ need dedicated PRs.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@vitest/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite-imagetools"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
    # No repo labels exist for Dependabot; [] disables default labels too.
    labels: []
    commit-message:
      prefix: "build"
      include: "scope"
    reviewers:
      - "jaydeelew"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      minor-and-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      security-updates:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 3
    # No repo labels exist for Dependabot; [] disables default labels too.
    # (ci was also not a defined label.)
    labels: []
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "jaydeelew"
