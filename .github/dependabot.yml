version: 2
updates:
  # Backend Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "backend"
    commit-message:
      prefix: "build(backend)"
      include: "scope"
    reviewers:
      - "jaydeelew"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "frontend"
    commit-message:
      prefix: "build(frontend)"
      include: "scope"
    reviewers:
      - "jaydeelew"

  # Root npm is intentionally omitted. The workspace root lists
  # packages/*, extension, and frontend, and extension depends on
  # @compareintel/core via file:../compare-core (a path that does not
  # exist from extension/). Dependabot's "npm_and_yarn in /." job
  # therefore fails with path_dependencies_not_reachable. Frontend
  # already has its own npm entry below; keep that as the npm source.
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "security"
      - "ci"
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "jaydeelew"
