version: 2
updates:
  # Backend Python dependencies (pip)
  - package-ecosystem: "pip"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    # Ignore rules apply to grouped version updates. Version ranges
    # also apply to Dependabot security updates (update-types alone do not).
    ignore:
      # bcrypt 5+ breaks passlib 1.7.4 (backend is pinned at bcrypt==4.0.1).
      - dependency-name: "bcrypt"
        update-types: ["version-update:semver-major"]
      - dependency-name: "bcrypt"
        versions: [">=5.0.0"]
      # openai 3+ needs a client migration (backend is on openai 2.x).
      - dependency-name: "openai"
        update-types: ["version-update:semver-major"]
      - dependency-name: "openai"
        versions: [">=3.0.0"]
    open-pull-requests-limit: 5
    # No repo labels exist for Dependabot; [] disables default labels too.
    labels: []
    commit-message:
      prefix: "build(backend)"
      include: "scope"
    reviewers:
      - "jaydeelew"

  # Frontend npm dependencies
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    # Ignore rules apply to grouped version updates. Version ranges
    # also apply to Dependabot security updates (update-types alone do not).
    ignore:
      # Pin Playwright to 1.60.x to match Docker image
      # mcr.microsoft.com/playwright:v1.60.0-noble. 1.64 is a minor bump,
      # so ignore versions rather than semver-major.
      - dependency-name: "@playwright/test"
        versions: [">=1.61.0"]
      - dependency-name: "playwright"
        versions: [">=1.61.0"]
      - dependency-name: "playwright-core"
        versions: [">=1.61.0"]
      # Hold vite 8+ (current range is ^6). Semver-major covers 7+
      # version updates; the version range also covers security updates.
      - dependency-name: "vite"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vite"
        versions: [">=8.0.0"]
    open-pull-requests-limit: 5
    # No repo labels exist for Dependabot; [] disables default labels too.
    labels: []
    commit-message:
      prefix: "build(frontend)"
      include: "scope"
    reviewers:
      - "jaydeelew"

  # Root npm is intentionally omitted. The workspace root lists
  # packages/*, extension, and frontend, and extension depends on
  # @compareintel/core via file:../compare-core (a path that does not
  # exist from extension/). Dependabot's "npm_and_yarn in /." job
  # therefore fails with path_dependencies_not_reachable. Frontend
  # already has its own npm entry below; keep that as the npm source.
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    groups:
      security-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
          - "minor"
    open-pull-requests-limit: 5
    # No repo labels exist for Dependabot; [] disables default labels too.
    # (ci was also not a defined label.)
    labels: []
    commit-message:
      prefix: "ci"
      include: "scope"
    reviewers:
      - "jaydeelew"
