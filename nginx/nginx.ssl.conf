events {}

http {
    include       /etc/nginx/mime.types.custom;
    default_type  application/octet-stream;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Content Security Policy - balanced security with functionality
    # - Scripts: self + inline + unsafe-eval (heic2any/libheif WASM) + Google reCAPTCHA + Cloudflare CDN
    # - Styles: self + inline (required for KaTeX, component styles) + Google Fonts
    # - Fonts: self + Google Fonts + data URIs
    # - Images: self + data URIs + compareintel.com (no wildcard for security)
    # - Connections: self + Sentry ingest (US) + Google reCAPTCHA + geolocation fallbacks
    # - Workers: self + blob (HEIC conversion via heic2any WASM worker; Sentry Replay)
    # - Frame ancestors: none (clickjacking protection)
    # Keep this policy in sync with frontend/index.html (meta CSP cannot set frame-ancestors).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://cdnjs.cloudflare.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https://compareintel.com; connect-src 'self' https://*.ingest.us.sentry.io https://www.google.com https://photon.komoot.io https://api.bigdatacloud.net https://api.zippopotam.us https://fonts.googleapis.com https://fonts.gstatic.com; frame-src https://www.google.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self';" always;

    # HTTP server - ACME challenge for Let's Encrypt renewal, then redirect to HTTPS
    server {
        listen 80;
        server_name compareintel.com www.compareintel.com;

        # Let's Encrypt ACME challenge (must be served over HTTP for renewal)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        location / {
            return 301 https://$server_name$request_uri;
        }
    }

    # HTTPS server
    server {
        listen 443 ssl;
        http2 on;
        server_name compareintel.com www.compareintel.com;

        # SSL configuration
        ssl_certificate /etc/letsencrypt/live/compareintel.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/compareintel.com/privkey.pem;
        ssl_trusted_certificate /etc/letsencrypt/live/compareintel.com/chain.pem;

        # SSL security settings
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # HSTS (HTTP Strict Transport Security)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

        # OCSP stapling
        ssl_stapling on;
        ssl_stapling_verify on;
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        resolver_timeout 5s;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/atom+xml image/svg+xml;

        # Serve robots.txt and sitemap.xml with proper headers
        location = /robots.txt {
            root /usr/share/nginx/html;
            access_log off;
            log_not_found off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }
        
        location = /sitemap.xml {
            root /usr/share/nginx/html;
            access_log off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            add_header Content-Type "application/xml; charset=utf-8";
        }

        # Hero / tutorial videos: avoid long-lived HTTP cache + range requests (Chrome may log
        # ERR_CACHE_OPERATION_NOT_SUPPORTED). Parity with frontend/vite-plugin-security-headers.ts (dev).
        location ~* \.(mp4|webm|m4v|ogg)$ {
            root /usr/share/nginx/html;
            expires -1;
            add_header Cache-Control "no-store" always;
        }
        
        # Explicit MIME type for .mjs files (PDF.js worker) - must be before location /
        # This location block must come before location / to take precedence
        location ~* \.mjs$ {
            root /usr/share/nginx/html;
            # Force JavaScript MIME type for .mjs files
            default_type application/javascript;
            expires 1y;
            add_header Cache-Control "public, immutable" always;
            # Explicitly set Content-Type - this should override mime.types
            add_header Content-Type "application/javascript; charset=utf-8" always;
            gzip_static on;
        }
        
        # Public comparison permalinks: backend HTML with OG/Twitter meta
        location ~ ^/c/[A-Za-z0-9]+$ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }

        # Serve static frontend files. Prerendered /models/<slug>/index.html is
        # served as a file; unknown slugs fall through to @spa_or_404 (real 404).
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/index.html @spa_or_404;
            
            # Prevent caching of HTML files
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
            }
            
            # Long-term cache for hashed assets
            location ~* \.(js|css)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                gzip_static on;
            }
            
            # Cache images and other assets (including modern formats)
            location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                # Enable compression for modern image formats
                gzip_static on;
            }
        }

        # Known public routes (prerendered) — serve index.html with 200.
        # Admin routes also use the SPA. /models is exact-only so unknown
        # /models/<slug> files fall through to 404.html (parity with nginx.prod.conf).
        location @spa_or_404 {
            root /usr/share/nginx/html;

            if ($uri ~ ^/(about|features|how-it-works|faq|image-generation|help-me-choose-methodology|privacy-policy|terms-of-service|admin)(/.*)?$) {
                rewrite ^ /index.html break;
            }

            if ($uri = /models) {
                rewrite ^ /index.html break;
            }

            if ($uri = /) {
                rewrite ^ /index.html break;
            }

            try_files /404.html =404;
        }

        # Pulse host metrics: exact-match only so other /internal paths stay
        # unproxied (they fall through to the SPA). Auth is backend METRICS_TOKEN
        # only; nginx forwards Authorization and does not add its own.
        location = /internal/metrics/host {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 15s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_buffering off;
            proxy_cache off;

            add_header Cache-Control "no-store" always;
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header X-XSS-Protection "1; mode=block";
        }

        # Proxy API requests to backend with rate limiting
        # Supports both /api/ (legacy) and /api/v1/ (versioned)
        location ~ ^/api(/v1)?/ {
            client_max_body_size 20M;   # Allow image uploads (base64 adds ~33% overhead)
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
            
            # Increase timeouts for long-running AI model comparisons
            # Extended mode requests can take up to 10 minutes, so allow 11 minutes with buffer
            proxy_connect_timeout 15s;
            proxy_send_timeout 660s;    # 11 minutes (accommodates extended mode up to 10 min)
            proxy_read_timeout 660s;    # 11 minutes (accommodates extended mode up to 10 min)
            proxy_buffering off;
            
            # Critical settings for Server-Sent Events (SSE) streaming
            proxy_cache off;                        # Disable caching
            proxy_set_header Connection '';         # Clear connection header for HTTP/1.1
            proxy_http_version 1.1;                 # Use HTTP/1.1 for streaming
            chunked_transfer_encoding on;           # Enable chunked transfer encoding
            
            # Additional SSE optimizations
            proxy_request_buffering off;            # Don't buffer request body
            tcp_nodelay on;                         # Disable Nagle's algorithm for low latency
            tcp_nopush off;                         # Send data immediately
            
            # Security headers for API
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
            add_header X-XSS-Protection "1; mode=block";
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
}
