# PID and logs in writable paths for non-root nginx user
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {}

http {
    # access_log is only valid in http/server/location (not main).
    access_log /dev/stdout;

    include       /etc/nginx/mime.types;
    types {
        application/javascript js mjs;
    }
    default_type  application/octet-stream;

    # Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/atom+xml image/svg+xml;

    server {
        listen 8080;

        # Security headers (apply to all responses)
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Serve robots.txt and sitemap.xml with proper headers
        location = /robots.txt {
            root /usr/share/nginx/html;
            access_log off;
            log_not_found off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
        }
        
        location = /sitemap.xml {
            root /usr/share/nginx/html;
            access_log off;
            expires 1d;
            add_header Cache-Control "public, max-age=86400";
            add_header Content-Type "application/xml; charset=utf-8";
        }

        # Hero / tutorial videos: avoid long-lived HTTP cache + range requests (Chrome may log
        # ERR_CACHE_OPERATION_NOT_SUPPORTED). Parity with frontend/vite-plugin-security-headers.ts (dev).
        location ~* \.(mp4|webm|m4v|ogg)$ {
            root /usr/share/nginx/html;
            expires -1;
            add_header Cache-Control "no-store" always;
        }
        
        # Public comparison permalinks: backend HTML with OG/Twitter meta
        location ~ ^/c/[A-Za-z0-9]+$ {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # /privacy is an alias of the canonical privacy policy. A direct request
        # must not be a second indexable URL.
        location = /privacy {
            return 301 /privacy-policy$is_args$args;
        }
        location = /privacy/ {
            return 301 /privacy-policy$is_args$args;
        }

        # App documents that are not prerendered marketing pages. Prefer the
        # noindex shell from the build, then the SPA index, so these stay 200.
        location = /admin {
            root /usr/share/nginx/html;
            try_files /admin/index.html /index.html =404;
        }
        location = /reset-password {
            root /usr/share/nginx/html;
            try_files /reset-password/index.html /index.html =404;
        }
        location = /terms {
            root /usr/share/nginx/html;
            try_files /terms/index.html /index.html =404;
        }

        # Unknown paths return a real 404. Do not try_files the error document
        # directly: nginx would serve 404.html with HTTP 200.
        # Upstream API and /c/ errors are not replaced (proxy_intercept_errors is off).
        error_page 404 /404.html;
        location = /404.html {
            internal;
            root /usr/share/nginx/html;
        }

        # Serve static frontend files. Prerendered pages are $uri/index.html.
        # Anything else is a 404 (the error_page above).
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/index.html =404;
            
            # Prevent caching of HTML files to ensure updates are picked up
            location ~* \.html$ {
                expires -1;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
            }
            
            # Long-term cache for hashed assets (JS, CSS with hashes)
            location ~* \.(js|css)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                
                # Enable gzip for these files specifically
                gzip_static on;
            }
            
            # Explicit MIME type for .mjs files (PDF.js worker)
            location ~* \.mjs$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                add_header Content-Type "application/javascript; charset=utf-8";
                gzip_static on;
            }
            
            # Cache images and other assets (including modern formats)
            location ~* \.(png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                # Enable compression for modern image formats
                gzip_static on;
            }
        }
        
        # Pulse host metrics: exact-match only so other /internal paths stay
        # unproxied (they 404 with the rest of the unknown paths). Auth is backend
        # METRICS_TOKEN only; nginx forwards Authorization and does not add its own.
        location = /internal/metrics/host {
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            proxy_connect_timeout 15s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_buffering off;
            proxy_cache off;

            add_header Cache-Control "no-store" always;
        }

        # Proxy API requests to backend
        # Supports both /api/ (legacy) and /api/v1/ (versioned)
        location ~ ^/api(/v1)?/ {
            client_max_body_size 20M;   # Allow image uploads (base64 adds ~33% overhead)
            proxy_pass http://backend:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Increase timeouts for long-running AI model comparisons
            # Extended mode requests can take up to 10 minutes, so allow 11 minutes with buffer
            proxy_connect_timeout 15s;
            proxy_send_timeout 660s;    # 11 minutes (accommodates extended mode up to 10 min)
            proxy_read_timeout 660s;    # 11 minutes (accommodates extended mode up to 10 min)
            proxy_buffering off;
            
            # Critical settings for Server-Sent Events (SSE) streaming
            proxy_cache off;                        # Disable caching
            proxy_set_header Connection '';         # Clear connection header for HTTP/1.1
            proxy_http_version 1.1;                 # Use HTTP/1.1 for streaming
            chunked_transfer_encoding on;           # Enable chunked transfer encoding
            
            # Additional SSE optimizations
            proxy_request_buffering off;            # Don't buffer request body
            tcp_nodelay on;                         # Disable Nagle's algorithm for low latency
            tcp_nopush off;                         # Send data immediately
        }
    }
}
